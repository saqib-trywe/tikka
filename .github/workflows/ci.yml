name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The daemon promises JDK 21+, so CI builds on the minimum.
  JAVA_VERSION: "21"
  # Pinned prerelease: 0.1.16 predates the 2026-07-28 revision. Bump deliberately.
  CONFORMANCE_VERSION: 0.2.0-alpha.11

# sbt 2's thin client joins separate arguments into one command, so each step passes a single `;`-joined string.
# `testFull` runs every test; plain `test` skips tests whose inputs sbt 2 has cached.
# GitHub sets CI=true, which makes warnings fatal (see build.sbt).

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt "scalafmtCheckAll; scalafmtSbtCheck"

  jvm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt "sharedJVM/testFull; proseJVM/testFull; core/testFull; daemon/testFull; cliJVM/testFull; integration/testFull; daemon/assembly"
      - name: Daemon jar embeds the UI and runs
        run: |
          unzip -l target/dist/tikka-daemon.jar | grep -q ' ui/main.js$'
          java --enable-native-access=ALL-UNNAMED -jar target/dist/tikka-daemon.jar --version
      - uses: actions/upload-artifact@v7
        with:
          name: tikka-daemon
          path: target/dist/tikka-daemon.jar
          retention-days: 3

  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt "sharedJS/testFull; proseJS/testFull; ui/testFull; ui/fullLinkJS"

  native:
    needs: jvm
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # sttp's curl backend links libcurl and libidn2.
      - name: Install native libraries and hyperfine (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libidn2-dev hyperfine gdb
      - name: Install native libraries and hyperfine (macOS)
        if: runner.os == 'macOS'
        run: brew install libidn2 hyperfine
      - uses: actions/download-artifact@v8
        with:
          name: tikka-daemon
          path: target/dist
      - run: sbt "sharedNative/testFull; cliNative/testFull; cliRelease"
      # The startup gate on `tikka search` against a live daemon, and a request through `tikka mcp` over stdin.
      - name: Native CLI against a real daemon
        run: scripts/native-check.sh "$(find target/out -path '*native*' -type f -name tikka)" target/dist/tikka-daemon.jar
      - name: Daemon log
        if: failure()
        run: cat target/native-check-home/daemon.log

  # TIK-4 was a race between OpenSSL's atexit handler and a thread still running its TLS destructors: roughly one run
  # in two hundred, so only repetition finds it. One pass of the check would have called the CLI healthy for months.
  native-stress:
    needs: jvm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libidn2-dev gdb
      - uses: actions/download-artifact@v8
        with:
          name: tikka-daemon
          path: target/dist
      - name: Link the CLI as it ships
        run: sbt cliRelease
      - name: Stress the CLI against a real daemon
        run: scripts/native-stress.sh "$(find target/out -path '*native*' -type f -name tikka)" target/dist/tikka-daemon.jar 200
      - name: Daemon log
        if: failure()
        run: cat target/native-stress-home/daemon.log

  conformance:
    needs: jvm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          name: tikka-daemon
          path: target/dist
      # A real daemon, both protocol revisions, every check enforced except those conformance-baseline.yml explains.
      - run: scripts/conformance.sh target/dist/tikka-daemon.jar
      - name: Daemon log
        if: failure()
        run: cat target/conformance-home/daemon.log
